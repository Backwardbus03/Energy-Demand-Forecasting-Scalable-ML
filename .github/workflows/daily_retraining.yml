name: Scheduled Retraining & Health Pipeline

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:      # Allow manual trigger from GitHub UI
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Pytest Test Suite Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EIA_API_KEY: "test_dummy_key_ci"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -q --maxfail=1 -m "not slow"

  retrain_and_monitor:
    name: Daily Retraining & Promotion
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # data/raw/ is gitignored, so persist the raw Parquet store between runs.
      # First run (cache miss) does a full backfill; later runs are incremental.
      - name: Restore raw data cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/eia
          key: eia-raw-${{ github.run_id }}
          restore-keys: |
            eia-raw-

      - name: Run Incremental Ingestion
        run: |
          set +e
          python scripts/fetch_raw_data.py --incremental
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "Ingestion succeeded with new records."
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "No new EIA records (incremental up to date)."
          else
            echo "Ingestion failed with critical error code $EXIT_CODE."
            exit $EXIT_CODE
          fi

      - name: Save raw data cache
        if: always() && hashFiles('data/raw/eia/**/data.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: data/raw/eia
          key: eia-raw-${{ github.run_id }}

      - name: Run Validation Gate
        run: python scripts/validate_raw_data.py --report data/raw/_logs/validation_report.json

      - name: Train Candidate Tier Models
        run: |
          python scripts/train_and_evaluate.py \
            --models-dir models_candidate/ \
            --output-summary data/evaluation_summary_candidate.json \
            --no-mlflow

      - name: Generate Evidently AI Drift & Performance Report
        run: |
          python scripts/run_drift_monitoring.py \
            --features-path data/processed/features.parquet \
            --output-html data/monitoring/drift_report.html \
            --output-json data/monitoring/drift_metrics.json

      - name: Evaluate Promotion Gate
        id: promotion
        run: |
          set +e
          python scripts/promote_model.py \
            --candidate-models-dir models_candidate \
            --candidate-summary data/evaluation_summary_candidate.json \
            --live-models-dir models \
            --live-summary data/evaluation_summary.json \
            --no-registry
          PROMOTE_STATUS=$?
          set -e
          if [ $PROMOTE_STATUS -eq 0 ]; then
            echo "decision=promoted" >> $GITHUB_OUTPUT
            echo "Candidate passed promotion gate and replaced models/"
          elif [ $PROMOTE_STATUS -eq 1 ]; then
            echo "decision=rejected" >> $GITHUB_OUTPUT
            echo "Candidate regressed; live production models kept."
          else
            echo "Promotion gate script failed with runtime error $PROMOTE_STATUS."
            exit $PROMOTE_STATUS
          fi

      - name: Commit Promoted Artifacts
        if: steps.promotion.outputs.decision == 'promoted'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/model_tier_*.joblib data/evaluation_summary.json data/processed/features.parquet data/monitoring/*
          if git diff --staged --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "chore(models): auto-promote retrained tier models [skip ci]"
            git push
            echo "Successfully committed and pushed promoted models to repository."
          fi

      - name: Upload Run Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retraining-artifacts-${{ github.run_id }}
          path: |
            data/monitoring/
            data/evaluation_summary*.json
            data/raw/_logs/

      - name: Reload Live Cloud Service
        if: steps.promotion.outputs.decision == 'promoted'
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          if [ -n "$RENDER_SERVICE_URL" ]; then
            curl -sf -X POST "$RENDER_SERVICE_URL/admin/reload-models" || echo "Cloud service reload ping failed (Render auto-deploy will deploy new models from git)"
          fi
